# The desktop viewer for decisions and learned rules: `ingrain-viewer`, opened by `ingrain view`.
#
# Its own workspace, not a member of the CLI's: Rune needs a newer Rust than the CLI's MSRV and
# pulls in a GPU stack that hooks and CI never need. It reuses ingrain-core and ingrain-ledger by path.
[workspace]

[package]
name = "ingrain-viewer"
version = "0.3.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/WispAgents/ingrain"
description = "A native viewer for ingrain decisions and learned rules"

[[bin]]
name = "ingrain-viewer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ingrain-core = { path = "../crates/core" }
ingrain-ledger = { path = "../crates/ledger" }
ingrain-engine = { path = "../crates/engine" }
# Rune pins a `dev` revision; every patch below must use the same rev (Rune's README, "Depending on Rune").
rune = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721", features = ["native-file-dialog", "tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }

[profile.release]
lto = "thin"
codegen-units = 4
