[workspace]
resolver = "2"
members = ["crates/core", "crates/engine", "crates/learn", "crates/ledger", "crates/cli"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "Apache-2.0"
repository = "https://github.com/WispAgents/ingrain"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ast-grep-core = "0.51"
ast-grep-config = "0.51"
ast-grep-language = "0.51"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
clap-markdown = "0.1"
rayon = "1"
ureq = { version = "3", features = ["json"] }
globset = "0.4"
tempfile = "3"
ingrain-core = { path = "crates/core" }
ingrain-engine = { path = "crates/engine" }
ingrain-learn = { path = "crates/learn" }
ingrain-ledger = { path = "crates/ledger" }
# The viewer's UI framework, pinned to a `dev` revision. Every patch below must use the same rev
# (Rune's README, "Depending on Rune"); update them together.
rune = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "native-file-dialog", "tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }

[profile.release]
lto = "thin"
codegen-units = 4

# Rune's patched crates (its root Cargo.toml's [patch.crates-io], at the same rev as `rune`).
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
