id: D-0026
decision: Promote a rule out of shadow only with at least 3 confirmed hits and at least 50% of hits confirmed, where a confirmed hit is a later mined correction of the same file that removed the matched code.
reason: Hit volume alone does not show a rule is right.
rejected:
- promoting shadow -> warn on hit volume alone
