name: docs
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docs/book/**
      - crates/cli/**
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  # Don't cancel a Pages deploy halfway through.
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.4
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: CLI reference is up to date
        run: |
          cargo run -q --locked -p ingrain -- --markdown-help > docs/book/src/reference/cli.md
          git diff --exit-code -- docs/book/src/reference/cli.md \
            || { echo "::error::Regenerate it: cargo run -q -p ingrain -- --markdown-help > docs/book/src/reference/cli.md"; exit 1; }
      - run: mdbook build docs/book
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/book
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
