# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # serde_yaml (deprecated) pulls in unsafe-libyaml. No known vulnerability; drop this once we
  # move off serde_yaml.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained, transitive via serde_yaml" },
  # zvariant, zvariant_derive and zbus_names (unmaintained, no known vulnerability) come only
  # through Rune's Linux D-Bus portal for the viewer's folder dialog (`native-file-dialog`).
  { id = "RUSTSEC-2026-0370", reason = "unmaintained, transitive via rune's Linux file dialog (zbus)" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained, transitive via rune's Linux file dialog (zbus)" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained, transitive via rune's Linux file dialog (zbus)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",   # arrayref, through winit's Wayland decorations (the viewer)
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "MPL-2.0",        # file-level copyleft: spellbook, Rune's spellchecker (the viewer)
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Rune, the viewer's UI framework, is published only as a git repository (pinned by rev).
allow-git = ["https://github.com/anomalyco/rune"]
