[package]
name = "ingrain"
description = "Keep coding agents in line with what your team decided: recorded decisions and rules learned from your corrections, enforced at edit time, before commit and in CI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ingrain"
path = "src/main.rs"

[features]
default = ["viewer"]
# `ingrain viewer`, the desktop window (Rune). Needs Rust 1.99, and on Linux links libxkbcommon and
# libwayland-client, so Linux release builds leave it out (`--no-default-features`) and run anywhere.
viewer = ["dep:rune", "dep:rune-kit", "dep:rune-theme-opencode"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap-markdown.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
globset.workspace = true
ingrain-core.workspace = true
ingrain-engine.workspace = true
ingrain-learn.workspace = true
ingrain-ledger.workspace = true
rune = { workspace = true, optional = true }
rune-kit = { workspace = true, optional = true }
rune-theme-opencode = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
