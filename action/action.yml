name: ingrain check
description: Fail pull requests whose added lines break recorded decisions or rules learned from corrections of agent code.
inputs:
  base:
    description: Revision to diff against. Defaults to the pull request base.
    default: ${{ github.event.pull_request.base.sha }}
  version:
    description: Release of WispAgents/ingrain to use.
    default: v0.2.0
runs:
  using: composite
  steps:
    - name: Install ingrain
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *) echo "unsupported runner $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        url="https://github.com/WispAgents/ingrain/releases/download/${{ inputs.version }}/ingrain-${{ inputs.version }}-$target.tar.gz"
        mkdir -p "$RUNNER_TEMP/ingrain"
        curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/ingrain"
        echo "$RUNNER_TEMP/ingrain" >> "$GITHUB_PATH"
    - name: Check added lines
      shell: bash
      run: ingrain check --diff "${{ inputs.base }}...HEAD" --format github
